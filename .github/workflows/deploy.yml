name: Deploy to Cloudflare

# Runs when you press "Run workflow" on GitHub (Actions → Deploy to Cloudflare),
# and automatically after each merge to main once Cloudflare is set up.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://mbm-technologies.com' }}
      VITE_SHOW_LOCAL_PORTALS: "false"
      VITE_CALIBRE_WEBSITE_URL: ${{ vars.VITE_CALIBRE_WEBSITE_URL }}
      VITE_CALIBRE_EXCHANGE_URL: ${{ vars.VITE_CALIBRE_EXCHANGE_URL }}
      VITE_CALIBRE_SWAP_URL: ${{ vars.VITE_CALIBRE_SWAP_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_COMPANY_LEGAL_NAME: ${{ vars.VITE_COMPANY_LEGAL_NAME }}
      VITE_COMPANY_REGISTRATION_NUMBER: ${{ vars.VITE_COMPANY_REGISTRATION_NUMBER }}
      VITE_COMPANY_ADDRESS: ${{ vars.VITE_COMPANY_ADDRESS }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
      VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL }}
      VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL }}
      VITE_X_URL: ${{ vars.VITE_X_URL }}
    steps:
      - name: Check Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CF_D1_DATABASE_ID" ]; then
            echo "Cloudflare is not set up yet (see docs/DEPLOYMENT.md). Skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - name: Build and test
        if: steps.ready.outputs.ok == 'true'
        run: npm test
      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        # The website also creates its tables on first use, so this step is a safety net.
        continue-on-error: true
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy
